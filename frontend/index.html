<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WishList</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
</head>

<body>

    <div id="app"></div>
    <div class="toast-container" id="toast-container"></div>

    <template id="tela-principal">

        <nav class="navbar">
            <a class="navbar-brand" href="#">
                <div class="brand-icon"><i class="bi bi-star-fill"></i></div>
                <div>
                    <div class="brand-title">WishList</div>
                    <div class="brand-sub">Suas listas de desejos, organizadas</div>
                </div>
            </a>
            <div class="navbar-right">
                <button class="btn-novo-item" id="btn-novo-item">+ Adicionar item</button>
                <div style="position:relative">
                    <div class="user-chip" id="user-chip">
                        <div class="chip-avatar" id="user-avatar">?</div>
                        <div>
                            <div class="chip-name" id="user-name-nav">Usuário</div>
                            <div class="chip-email" id="user-email-nav">email</div>
                        </div>
                        <i class="bi bi-chevron-down" style="font-size:11px;color:var(--muted);margin-left:4px"></i>
                    </div>
                    <div id="perfil-dropdown" class="perfil-dropdown">
                        <div class="perfil-drop-name" id="drop-user-name">Usuário</div>
                        <button class="perfil-drop-btn" id="btn-abrir-perfil">
                            <i class="bi bi-person-gear"></i> Editar perfil
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <div class="listas-bar">
            <div class="listas-header">
                <span class="listas-titulo"><i class="bi bi-list-ul"></i> Minhas listas</span>
                <button class="btn-nova-lista" id="btn-nova-lista">+ Nova lista</button>
            </div>
            <div class="abas-row" id="wishlists-abas"></div>
        </div>

        <div class="lista-titulo-bar">
            <div>
                <div class="lista-nome" id="lista-titulo">Carregando...</div>
                <div class="lista-sub" id="lista-subtitulo"></div>
            </div>
            <div class="lista-acoes">
                <button class="btn-icon" id="btn-editar-lista" title="Editar lista">
                    <i class="bi bi-pencil"></i>
                </button>
                <button class="btn-icon danger" id="btn-excluir-lista" title="Excluir lista">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        </div>

        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-icon-wrap rosa"><i class="bi bi-wallet2"></i></div>
                <div>
                    <div class="stat-label">Total estimado</div>
                    <div class="stat-value" id="stat-total">R$ 0,00</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-wrap azul"><i class="bi bi-bag"></i></div>
                <div>
                    <div class="stat-label">Itens na lista</div>
                    <div class="stat-value" id="stat-count">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-wrap laranja"><i class="bi bi-fire"></i></div>
                <div>
                    <div class="stat-label">Prioridade alta</div>
                    <div class="stat-value" id="stat-alta">0</div>
                </div>
            </div>
        </div>

        <div class="filtros-bar">
            <div class="filtro-group">
                <label class="filtro-label">Categoria</label>
                <select class="filtro-select" id="filtro-categoria">
                    <option value="">Todas as categorias</option>
                </select>
            </div>
            <div class="filtro-group">
                <label class="filtro-label">Prioridade</label>
                <select class="filtro-select" id="filtro-prioridade">
                    <option value="">Todas as prioridades</option>
                    <option value="alta">Alta</option>
                    <option value="media">Média</option>
                    <option value="baixa">Baixa</option>
                </select>
            </div>
            <div class="filtro-group filtro-busca-wrap">
                <label class="filtro-label">Buscar</label>
                <i class="bi bi-search"></i>
                <input type="text" class="filtro-input" id="filtro-busca" placeholder="Buscar por nome..." />
            </div>
            <span class="filtros-count" id="items-count">0 itens</span>
        </div>

        <div class="items-section">
            <div class="items-grid" id="items-grid"></div>
            <div class="empty-state d-none" id="empty-state">
                <i class="bi bi-heart"></i>
                <p>Nenhum item encontrado.<br>Adicione seu primeiro desejo!</p>
            </div>
        </div>

        <div class="modal fade" id="modalItem" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header border-0 pb-0">
                        <div>
                            <div class="modal-title-text" id="modal-title">Novo item</div>
                            <div class="modal-sub" id="modal-subtitle">Adicione um item à sua lista.</div>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="item-id" />
                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-control" id="item-name" placeholder="Ex: Notebook novo" />
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col">
                                <label class="form-label">Preço (R$)</label>
                                <input type="number" class="form-control" id="item-price" placeholder="0,00" min="0"
                                    step="0.01" />
                            </div>
                            <div class="col">
                                <label class="form-label">Categoria</label>
                                <select class="form-select" id="item-category"></select>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col">
                                <label class="form-label">Prioridade</label>
                                <select class="form-select" id="item-priority">
                                    <option value="media">Média</option>
                                    <option value="alta">Alta</option>
                                    <option value="baixa">Baixa</option>
                                </select>
                            </div>
                            <div class="col">
                                <label class="form-label">Status</label>
                                <select class="form-select" id="item-status">
                                    <option value="desejado">Desejado</option>
                                    <option value="comprado">Comprado</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Link do produto (opcional)</label>
                            <input type="url" class="form-control" id="item-link" placeholder="https://..." />
                        </div>
                    </div>
                    <div class="modal-footer d-flex justify-content-end gap-2">
                        <button class="btn-cancelar" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn-adicionar">Adicionar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalConfirm" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content">
                    <div class="modal-body text-center p-4">
                        <div class="modal-icon-wrap" style="background:var(--primary-light)">
                            <i class="bi bi-trash" style="color:var(--primary)"></i>
                        </div>
                        <div class="modal-confirm-title">Excluir item</div>
                        <div class="modal-confirm-sub">Tem certeza? Esta ação não pode ser desfeita.</div>
                    </div>
                    <div class="modal-footer justify-content-center gap-2 border-0 pb-4">
                        <button class="btn-cancelar" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn-adicionar" id="btn-confirm-excluir">Excluir</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalConfirmLista" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content">
                    <div class="modal-body text-center p-4">
                        <div class="modal-icon-wrap" style="background:#fff3e0">
                            <i class="bi bi-trash" style="color:#e65100"></i>
                        </div>
                        <div class="modal-confirm-title">Excluir lista</div>
                        <div class="modal-confirm-sub">Tem certeza que deseja excluir esta lista? Os itens vinculados
                            não serão excluídos.</div>
                    </div>
                    <div class="modal-footer justify-content-center gap-2 border-0 pb-4">
                        <button class="btn-cancelar" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn-adicionar" id="btn-confirm-excluir-lista">Excluir</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalConfirmConta" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content">
                    <div class="modal-body text-center p-4">
                        <div class="modal-icon-wrap" style="background:var(--primary-light)">
                            <i class="bi bi-person-x" style="color:var(--primary)"></i>
                        </div>
                        <div class="modal-confirm-title">Excluir conta</div>
                        <div class="modal-confirm-sub">Tem certeza? Todos os seus dados serão perdidos permanentemente.
                        </div>
                    </div>
                    <div class="modal-footer justify-content-center gap-2 border-0 pb-4">
                        <button class="btn-cancelar" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn-adicionar" id="btn-confirm-excluir-conta">Excluir conta</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalHistorico" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header border-0 pb-0">
                        <div>
                            <div class="modal-title-text">Histórico de preços</div>
                            <div class="modal-sub" id="hist-item-nome"></div>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div id="hist-resumo"></div>
                        <div id="hist-lista"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalLista" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content">
                    <div class="modal-header border-0 pb-0">
                        <div class="modal-title-text" id="modal-lista-title">Nova lista</div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="lista-id" />
                        <label class="form-label">Nome da lista</label>
                        <input type="text" class="form-control" id="lista-nome" placeholder="Ex: Lista de natal" />
                    </div>
                    <div class="modal-footer d-flex justify-content-end gap-2">
                        <button class="btn-cancelar" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn-adicionar" id="btn-salvar-lista">Salvar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalPerfil" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content">
                    <div class="modal-header border-0 pb-0">
                        <div class="modal-title-text">Editar perfil</div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control mb-3" id="perfil-name" />
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="perfil-email" />
                    </div>
                    <div class="modal-footer d-flex flex-column gap-2">
                        <button class="btn-adicionar w-100" id="btn-salvar-perfil">Salvar alterações</button>
                        <button class="btn-cancelar w-100" style="color:#dc2626;border-color:#dc2626"
                            id="btn-excluir-perfil">
                            Excluir conta
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
